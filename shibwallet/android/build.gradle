// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.0.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.4'
        // Kotlin Gradle plugin required by the Tangem hardware-wallet plugin (TangemPlugin.kt).
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Tangem SDK is hosted on GitHub Packages (NOT JitPack — the JitPack badge is misleading,
        // builds are "ok" there but artifacts get published to GitHub Packages instead).
        //
        // To resolve com.tangem.tangem-sdk-kotlin:{android,core}, supply read:packages credentials
        // via either ~/.gradle/gradle.properties:
        //   gpr.user=<github-username>
        //   gpr.key=<github-PAT-with-read:packages-scope>
        // …or the GITHUB_ACTOR / GITHUB_TOKEN environment variables (works in CI by default).
        maven {
            name = 'TangemGitHubPackages'
            url = uri('https://maven.pkg.github.com/tangem/tangem-sdk-android')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
